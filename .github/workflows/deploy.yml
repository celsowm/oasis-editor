name: Build and Deploy Demo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Ribbon parity matrix
        run: npm run audit:ribbon

      - name: Verify Ribbon icon inventory
        run: npm run audit:ribbon:icons

      - name: Run Tests
        run: npm test

      - name: Build App
        run: npm run build:app

      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Chromium setup failed (attempt $attempt); retrying after a short pause."
              sleep 15
            fi
          done
          exit 1

      - name: Verify Ribbon browser scenarios
        run: npm run test:ribbon:ci

      - name: Retain synthetic Ribbon evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ribbon-reference
          path: test-results/ribbon

      - name: Smoke Test Production Build
        run: npm run test:smoke

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-app
          branch: gh-pages
