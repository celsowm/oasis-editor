name: Apply Tracked Cell Merge Resolution

on:
  push:
    branches: [main]
    paths:
      - scripts/ci/apply-tracked-cell-merge-resolution.mjs
      - .github/workflows/apply-tracked-cell-merge-resolution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply cell merge resolution patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/apply-tracked-cell-merge-resolution.mjs")
          content = path.read_text()
          content = content.replace(r"\`${path}", r"\`\${path}")
          content = content.replace(
              r'expect((xml.match(/<w:vMerge w:val="restart"\/>/g) ?? []).length).toBe(2);',
              r'expect(xml.split(\'<w:vMerge w:val="restart"/>\').length - 1).toBe(2);',
          )
          structural_fallback = r'''  if (vMerge) {\n    const value = getAttributeValue(vMerge, "val");\n    return value === "restart" ? "restart" : "continue";\n  }\n\n  const cellMerge = getFirstChildByTagNameNS(cellProperties, WORD_NS, "cellMerge");\n  return parseTrackedVerticalMergeValue(getAttributeValue(cellMerge, "vMerge"));'''
          structural_only = r'''  if (!vMerge) {\n    return undefined;\n  }\n\n  const value = getAttributeValue(vMerge, "val");\n  return value === "restart" ? "restart" : "continue";'''
          if structural_fallback not in content:
              raise SystemExit("cellMerge fallback patch anchor not found")
          content = content.replace(structural_fallback, structural_only, 1)
          path.write_text(content)
          PY
          node scripts/ci/apply-tracked-cell-merge-resolution.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit cell merge resolver slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(core): resolve tracked vertical cell merges"
          git push origin HEAD:main
