name: Nested table command verification

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[nested-verify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run verification
        shell: bash
        run: |
          set +e
          mkdir -p .ci-logs

          run_check() {
            local name="$1"
            shift
            "$@" > ".ci-logs/${name}.log" 2>&1
            echo "$?" > ".ci-logs/${name}.code"
          }

          run_check install npm ci
          if [ "$(cat .ci-logs/install.code)" -eq 0 ]; then
            run_check typecheck npm run typecheck
            run_check import-graph npm run check:imports
            run_check focused-tests npx vitest run \
              tests/vitest/__tests__/app/nestedTableOperations.test.ts \
              tests/vitest/__tests__/core/nestedTableCoreCommands.test.ts \
              tests/vitest/__tests__/export/docxNestedTableRoundTrip.test.ts \
              tests/vitest/__tests__/ui/canvasNestedTableLayout.test.ts
            run_check full-tests npm test
            run_check build-app npm run build:app
            run_check build-lib npm run build:lib
          else
            for name in typecheck import-graph focused-tests full-tests build-app build-lib; do
              echo 125 > ".ci-logs/${name}.code"
              echo "Skipped because npm ci failed." > ".ci-logs/${name}.log"
            done
          fi

      - name: Comment result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const checks = ['install', 'typecheck', 'import-graph', 'focused-tests', 'full-tests', 'build-app', 'build-lib'];
            let failed = false;
            const sections = checks.map((name) => {
              const code = fs.existsSync(`.ci-logs/${name}.code`)
                ? Number(fs.readFileSync(`.ci-logs/${name}.code`, 'utf8').trim())
                : 999;
              const status = code === 0 ? 'PASS' : code === 125 ? 'SKIPPED' : 'FAIL';
              if (status === 'FAIL') failed = true;
              const raw = fs.existsSync(`.ci-logs/${name}.log`)
                ? fs.readFileSync(`.ci-logs/${name}.log`, 'utf8')
                : 'Log unavailable.';
              const tail = raw.split('\n').slice(-220).join('\n');
              return `## ${name}: ${status} (exit ${code})\n\n\`\`\`text\n${tail}\n\`\`\``;
            });
            const body = [
              '# Nested table command verification',
              '',
              `- Commit: \`${context.sha}\``,
              `- Overall: **${failed ? 'FAIL' : 'PASS'}**`,
              '',
              ...sections,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 84,
              body: body.slice(0, 65000),
            });
            if (failed) core.setFailed('Verification failed.');
