name: Publish npm Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[nested-verify]') && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Ribbon parity matrix
        run: npm run audit:ribbon

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build:app

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test production build
        run: npm run test:smoke

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Multiple main pushes can queue release jobs. Do not publish an older
      # snapshot after a newer commit has already become main.
      - name: Confirm release source is current main
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE_SHA="$(git rev-parse HEAD)"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${BASE_SHA}" == "$(git rev-parse origin/main)" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale main release; a newer commit will publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide publish version
        if: steps.freshness.outputs.publish == 'true'
        id: versioning
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          # Query all published versions with a fresh registry read, rather
          # than trusting a possibly stale "latest" dist-tag or npm cache.
          if VERSIONS_JSON="$(npm view "${PACKAGE_NAME}" versions --json --prefer-online --cache-min=0 2>/dev/null)"; then
            NEXT_VERSION="$(printf '%s' "${VERSIONS_JSON}" | node -e "
              let input = '';
              process.stdin.on('data', chunk => input += chunk);
              process.stdin.on('end', () => {
                const versions = JSON.parse(input);
                const list = Array.isArray(versions) ? versions : [versions];
                const stable = list
                  .filter(v => /^\\d+\\.\\d+\\.\\d+$/.test(v))
                  .map(v => v.split('.').map(Number));
                if (!stable.length) throw new Error('No stable npm versions found');
                stable.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
                const next = [...stable[stable.length - 1]];
                next[2] += 1;
                process.stdout.write(next.join('.'));
              });
            ")"

            npm version "${NEXT_VERSION}" -m "chore(release): v%s [skip ci]"
            echo "publish_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_mode=registry-bump" >> "$GITHUB_OUTPUT"
          else
            git add package.json package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): v${PACKAGE_VERSION} [skip ci]"
            fi
            if ! git rev-parse "v${PACKAGE_VERSION}" >/dev/null 2>&1; then
              git tag "v${PACKAGE_VERSION}"
            fi
            echo "publish_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_mode=initial" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.freshness.outputs.publish == 'true'
        run: npm run build:lib

      # The source may have advanced while the package was building.
      - name: Recheck main before publication
        if: steps.freshness.outputs.publish == 'true'
        id: publish_guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" == "${{ steps.freshness.outputs.base_sha }}" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publication of superseded source."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.publish_guard.outputs.current == 'true'
        run: npm publish --access public --provenance

      - name: Push release commit and tag
        if: steps.publish_guard.outputs.current == 'true'
        run: git push origin HEAD:main --follow-tags
