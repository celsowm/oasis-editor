name: OOXML Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ooxml:audit
      - run: npm run ooxml:evidence
      - run: npm run ooxml:report -- --evidence test-results/ooxml/vitest.json --require-evidence --baseline src/ooxml/capabilities/baseline.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ooxml-evidence
          path: test-results/ooxml
  schema-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ooxml:schemas
      - run: npm run ooxml:evidence
      - run: npm run ooxml:inventory -- --manifest test-results/ooxml/ecma/manifest.json --require-docx-scope --evidence test-results/ooxml/vitest.json --require-evidence --baseline src/ooxml/capabilities/baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: ooxml-schema-inventory
          path: test-results/ooxml/report
  openxml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Run focused serializer regression tests
        run: npx vitest run tests/vitest/__tests__/ooxml/validatorSerializationRegression.test.ts tests/vitest/__tests__/import/styleGalleryMetadata.test.ts tests/vitest/__tests__/import/docxImport.propertyRevisions.test.ts
      - name: Generate production corpus
        run: npx vitest run tests/vitest/__tests__/ooxml/validationCorpus.test.ts
        env:
          OOXML_VALIDATION_CORPUS: test-results/ooxml-validation/corpus
      - name: Restore validator
        run: dotnet restore tools/ooxml-validator/OoxmlValidator.csproj
      - name: Require conformant production outputs and negative controls
        run: |
          dotnet run --project tools/ooxml-validator/OoxmlValidator.csproj --no-restore -- test-results/ooxml-validation/corpus/positive test-results/ooxml-validation/positive.json
          dotnet run --project tools/ooxml-validator/OoxmlValidator.csproj --no-restore -- test-results/ooxml-validation/corpus/negative test-results/ooxml-validation/negative.json
          node scripts/ooxml/check-validator-corpus.mjs test-results/ooxml-validation/positive.json test-results/ooxml-validation/negative.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openxml-validation
          path: test-results/ooxml-validation
  extended-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Generate extended feature corpus
        run: npx vitest run tests/vitest/__tests__/ooxml/extendedValidationCorpus.test.ts
        env:
          OOXML_VALIDATION_CORPUS: test-results/ooxml-validation/corpus
      - run: dotnet restore tools/ooxml-validator/OoxmlValidator.csproj
      - name: Require zero diagnostics on extended feature corpus
        run: |
          dotnet run --project tools/ooxml-validator/OoxmlValidator.csproj --no-restore -- test-results/ooxml-validation/corpus/extended test-results/ooxml-validation/extended.json
          node scripts/ooxml/check-extended-validator-corpus.mjs test-results/ooxml-validation/extended.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openxml-extended-validation
          path: test-results/ooxml-validation
  toc-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Qualify existing repository DOCX TOC and retain evidence
        run: npx vitest run tests/vitest/__tests__/core/tocCorpusF3H4.test.ts --reporter=verbose
        env:
          OASIS_TOC_CORPUS_REPORT: test-results/toc-interoperability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toc-interoperability
          path: test-results/toc-interoperability
  source-preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Validate namespace identity and repeated source-backed mutations
        run: |
          npx vitest run tests/vitest/__tests__/export/docxHeaderFooterNamespacePrefixPreservation.todo.test.ts tests/vitest/__tests__/export/docxHeaderFooterStoryReferences.test.ts tests/vitest/__tests__/export/docxHeaderFooterSourcePathPreservation.test.ts tests/vitest/__tests__/export/docxHeaderFooterRootSourcePreservation.test.ts tests/vitest/__tests__/export/docxWholeParagraphSource.test.ts tests/vitest/__tests__/export/docxSourcePackagePreservation.test.ts tests/vitest/__tests__/ooxml/opaqueObjects.test.ts tests/vitest/__tests__/core/runKind.test.ts tests/vitest/__tests__/import/docxImport.textBox.test.ts tests/vitest/__tests__/export/docxExport.textBox.test.ts --reporter=json --outputFile=test-results/ooxml-preservation/vitest.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ooxml-preservation
          path: test-results/ooxml-preservation
