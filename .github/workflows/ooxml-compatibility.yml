name: OOXML Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ooxml:audit
      - run: npm run ooxml:evidence
      - run: npm run ooxml:report -- --evidence test-results/ooxml/vitest.json --require-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ooxml-evidence
          path: test-results/ooxml
  schema-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ooxml:schemas
      - run: npm run ooxml:inventory -- --manifest test-results/ooxml/ecma/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: ooxml-schema-inventory
          path: test-results/ooxml/report
