name: Apply Tracked Structural Removal

on:
  push:
    branches: [main]
    paths:
      - scripts/ci/apply-tracked-structural-removal.mjs
      - .github/workflows/apply-tracked-structural-removal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply structural removal patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/apply-tracked-structural-removal.mjs")
          content = path.read_text()
          content = content.replace(r"\`${path}", r"\`\${path}")
          path.write_text(content)
          PY
          node scripts/ci/apply-tracked-structural-removal.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit structural resolver slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(core): resolve tracked table removals"
          git push origin HEAD:main
