name: Apply Tracked Revision Resolver

on:
  push:
    branches: [main]
    paths:
      - scripts/ci/apply-tracked-revision-resolver-contract.mjs
      - .github/workflows/apply-tracked-revision-resolver.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply resolver contract patch
        run: node scripts/ci/apply-tracked-revision-resolver-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit resolver slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(core): resolve tracked revisions"
          git push origin HEAD:main
