name: Apply Tracked Table Property Exception Revisions

on:
  push:
    branches: [main]
    paths:
      - scripts/ci/apply-tracked-tblprex-change.py
      - .github/workflows/apply-tracked-tblprex-change.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply semantic tblPrExChange patch
        run: python3 scripts/ci/apply-tracked-tblprex-change.py
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit semantic tblPrExChange slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git rm -f \
            scripts/ci/apply-tracked-cell-merge-resolution.mjs \
            .github/workflows/apply-tracked-cell-merge-resolution.yml \
            scripts/ci/apply-tracked-tblprex-change.py \
            .github/workflows/apply-tracked-tblprex-change.yml
          git diff --cached --check
          git commit -m "feat(core): resolve tracked table property exceptions"
          git pull --rebase origin main
          git push origin HEAD:main
