name: Ribbon Geometry Regression
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/**'
      - 'src/core/**'
      - 'src/i18n/**'
      - 'src/styles/**'
      - 'scripts/**ribbon**'
      - 'tests/browser/ribbon/**'
      - '.github/workflows/ribbon-geometry.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser and system dependencies
        id: browser-install
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps ${{ matrix.browser }}; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Verify geometry in both densities
        id: geometry
        run: npm run test:ribbon:ci
        env:
          RIBBON_BROWSER: ${{ matrix.browser }}
          RIBBON_SUITE: geometry
      - name: Verify simplified command reachability
        if: steps.geometry.outcome == 'success' || steps.geometry.outcome == 'failure'
        run: npm run test:ribbon:ci
        env:
          RIBBON_BROWSER: ${{ matrix.browser }}
          RIBBON_SUITE: simplified
      - name: Verify watermark gallery and custom editor
        if: always() && steps.browser-install.outcome == 'success'
        run: npm run test:ribbon:ci
        env:
          RIBBON_BROWSER: ${{ matrix.browser }}
          RIBBON_SUITE: watermark
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ribbon-geometry-${{ matrix.browser }}
          path: |
            test-results/ribbon/geometry
            test-results/ribbon/simplified
            test-results/ribbon/watermark
